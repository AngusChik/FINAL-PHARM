<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordering Sheet</title>
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}?v=20260826-navtext1">
    <link rel="stylesheet" href="{% static 'css/ui-system.css' %}?v=20260828-devenv1">
    <style>
        /* Design tokens (mirrors base.html :root — the iframe is its own document) */
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }
    </style>
</head>
<body class="embed-shell"
      data-page="{{ request.resolver_match.url_name|default:'ordering_sheet' }}"
    data-can-administer="{{ can_administer|yesno:'true,false' }}"
      data-table-preference-url="{% url 'table_preference_api' %}">
    {{ ui_table_preferences|json_script:"ui-table-preferences" }}
    {% include 'partials/_notifications.html' with notifications_toasts_only=True %}
    <main id="main-content" tabindex="-1">
        {% include 'partials/_ordering_sheet.html' %}
    </main>
    <script src="{% static 'js/ui-system.js' %}?v=20260827-productenter1"></script>
</body>
</html>
