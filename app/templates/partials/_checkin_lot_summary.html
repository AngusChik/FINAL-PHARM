{% for lot in product_lots %}
<div><strong>{{ lot.staff_name }}</strong> · <span class="ui-stock-quantity ui-stock-quantity--inline">{{ lot.quantity }}</span> unit{{ lot.quantity|pluralize }}{% if lot.expiry_date %} · exp {{ lot.expiry_date|date:"d-m-Y" }}{% endif %}</div>
{% empty %}
<div>UNASSIGNED · <span class="ui-stock-quantity ui-stock-quantity--inline">{{ product.quantity_in_stock }}</span> unit{{ product.quantity_in_stock|pluralize }}</div>
{% endfor %}
